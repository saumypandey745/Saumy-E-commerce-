name: Enterprise Security Pipeline (SAST/DAST)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast_codeql:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  container_scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build local API Gateway image
        run: docker build -t enterprise-api-gateway:latest ./api-gateway

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'enterprise-api-gateway:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  dast_owasp_zap:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: [sast_codeql, container_scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Mock DAST Target Standup
        run: echo "In a real pipeline, we would spin up a staging cluster here."

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'https://api.enterprise-ecommerce.com'
          fail_action: false
