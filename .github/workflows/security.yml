name: Enterprise Security Pipeline (SAST & DAST)

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast_scan:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'javascript, python'

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  container_scan:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build local image for scanning
        run: docker build -t ecommerce/api-gateway:latest ./api-gateway

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ecommerce/api-gateway:latest'
          format: 'table'
          exit-code: '1' # Fail pipeline if Critical vulnerabilities found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  dast_scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: [sast_scan, container_scan]
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'https://staging-api.enterprise-ecommerce.com'
          fail_action: true # Fail pipeline if vulnerabilities found
