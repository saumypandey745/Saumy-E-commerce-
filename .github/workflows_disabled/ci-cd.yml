name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci || npm install
      
    # Example tests run - uncomment if tests are added
    # - name: Run Tests
    #   run: npm test
      
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service: 
          - api-gateway
          - microservices/auth-service
          - microservices/product-service
          - microservices/order-service
          - microservices/payment-service
          - microservices/search-service
          - microservices/cart-service
          - microservices/review-service
          - frontend/apps/storefront
          - frontend/apps/admin-dashboard
          - frontend/apps/seller-hub
          
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker Image
      run: |
        SERVICE_NAME=$(basename ${{ matrix.service }})
        DOCKERFILE_PATH=${{ matrix.service }}/Dockerfile
        # For microservices that build from root context:
        if [[ "${{ matrix.service }}" == microservices/* || "${{ matrix.service }}" == "api-gateway" ]]; then
          docker build -t ecommerce-enterprise-${SERVICE_NAME}:latest -f $DOCKERFILE_PATH .
        else
          # For frontend apps that build from their own context:
          docker build -t ecommerce-enterprise-${SERVICE_NAME}:latest -f $DOCKERFILE_PATH ${{ matrix.service }}
        fi
