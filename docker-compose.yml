version: '3.8'
services:
  mongo:
    image: mongo:6.0
    volumes:
    - mongo_data:/data/db
    networks:
    - ecommerce-network
  redis:
    image: redis:7.0-alpine
    volumes:
    - redis_data:/data
    networks:
    - ecommerce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # CRIT-04: PostgreSQL for order-service and payment-service (replaces SQLite)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_MULTIPLE_DATABASES: order_db,payment_db,promotion_db
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./scripts/init-multiple-postgres-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    networks:
    - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
    - 5672:5672
    - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpassword
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    networks:
    - ecommerce-network
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
    - 9200:9200
    volumes:
    - es_data:/usr/share/elasticsearch/data
    networks:
    - ecommerce-network
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    ports:
    - 5601:5601
    environment:
    - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
    - elasticsearch
    networks:
    - ecommerce-network
  auth-service:
    build:
      context: .
      dockerfile: ./microservices/auth-service/Dockerfile
    environment:
    - PORT=8001
    - MONGO_URI=mongodb://mongo:27017/ecommerce_auth
    - JWT_SECRET=supersecretjwtkey_12345
    - REDIS_URL=redis://redis:6379
    - SMTP_HOST=${SMTP_HOST:-}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_USER=${SMTP_USER:-}
    - SMTP_PASS=${SMTP_PASS:-}
    - SMTP_FROM=${SMTP_FROM:-}
    - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
    - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
    - TWILIO_FROM=${TWILIO_FROM:-}
    - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-1079312831480-8hth9o4voo676a9kolh521jcrq6f48pi.apps.googleusercontent.com}
    depends_on:
    - mongo
    - redis
    networks:
    - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  product-service:
    build:
      context: .
      dockerfile: ./microservices/product-service/Dockerfile
    environment:
    - PORT=8003
    - MONGO_URI=mongodb://mongo:27017/ecommerce_products
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://admin:adminpassword@rabbitmq:5672
    - MINIO_ENDPOINT=minio
    - MINIO_PORT=9000
    - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
    - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-adminpassword}
    - JWT_SECRET=${JWT_SECRET}
    depends_on:
    - mongo
    - redis
    - rabbitmq
    networks:
    - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
  order-service:
    build:
      context: .
      dockerfile: ./microservices/order-service/Dockerfile
    environment:
    - PORT=8004
    - NODE_ENV=development
    # CRIT-04: Use PostgreSQL in Docker
    - DB_DIALECT=postgres
    - DB_HOST=postgres
    - DB_NAME=order_db
    - DB_USER=admin
    - DB_PASS=${POSTGRES_PASSWORD:-adminpassword}
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://admin:adminpassword@rabbitmq:5672
    - PRODUCT_SERVICE_URL=http://product-service:8003
    - JWT_SECRET=${JWT_SECRET}
    depends_on:
    - rabbitmq
    - product-service
    - postgres
    networks:
    - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
  payment-service:
    build:
      context: .
      dockerfile: ./microservices/payment-service/Dockerfile
    environment:
    - PORT=8006
    - NODE_ENV=development
    # CRIT-04: Use PostgreSQL in Docker
    - DB_DIALECT=postgres
    - DB_HOST=postgres
    - DB_NAME=payment_db
    - DB_USER=admin
    - DB_PASS=${POSTGRES_PASSWORD:-adminpassword}
    - RABBITMQ_URL=amqp://admin:adminpassword@rabbitmq:5672
    - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_mock123}
    - JWT_SECRET=${JWT_SECRET}
    depends_on:
    - rabbitmq
    - postgres
    networks:
    - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  cart-service:
    build:
      context: .
      dockerfile: ./microservices/cart-service/Dockerfile
    environment:
    - PORT=8007
    - REDIS_URL=redis://redis:6379
    - JWT_SECRET=${JWT_SECRET}
    depends_on:
    - redis
    networks:
    - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  search-service:
    build:
      context: .
      dockerfile: ./microservices/search-service/Dockerfile
    environment:
    - PORT=8008
    - RABBITMQ_URL=amqp://admin:adminpassword@rabbitmq:5672
    - ELASTICSEARCH_URL=http://elasticsearch:9200
    - JWT_SECRET=supersecretjwtkey_12345
    depends_on:
    - rabbitmq
    - elasticsearch
    networks:
    - ecommerce-network
  ai-service:
    build:
      context: .
      dockerfile: ./microservices/ai-service/Dockerfile
    environment:
    - PORT=8005
    - OPENAI_API_KEY=mock-key-for-now
    - REDIS_URL=redis://redis:6379
    - JWT_SECRET=supersecretjwtkey_12345
    depends_on:
    - redis
    networks:
    - ecommerce-network
  minio:
    image: minio/minio:RELEASE.2023-10-16T04-13-43Z
    ports:
    - 9000:9000
    - 9001:9001
    environment:
    - MINIO_ROOT_USER=admin
    - MINIO_ROOT_PASSWORD=adminpassword
    command: server /data --console-address ":9001"
    volumes:
    - minio_data:/data
    networks:
    - ecommerce-network
  minio-createbucket:
    image: minio/mc
    depends_on:
    - minio
    entrypoint: '/bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 admin
      adminpassword; /usr/bin/mc mb myminio/kyc-documents || true; /usr/bin/mc anonymous
      set public myminio/kyc-documents || true; /usr/bin/mc mb myminio/product-assets
      || true; /usr/bin/mc anonymous set public myminio/product-assets || true; exit
      0; "

      '
    networks:
    - ecommerce-network
  monitoring-service:
    build:
      context: ./microservices/monitoring-service
      dockerfile: Dockerfile
    ports:
    # HIGH-03: Fixed port collision — was 8006:8006 which conflicted with payment-service
    - 8011:8011
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - PORT=8011
    - MONGO_URI=mongodb://mongo:27017/ecommerce
    - REDIS_URL=redis://redis:6379
    - JWT_SECRET=${JWT_SECRET}
    depends_on:
    - mongo
    - redis
    networks:
    - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  review-service:
    build:
      context: .
      dockerfile: ./microservices/review-service/Dockerfile
    environment:
    - PORT=8009
    - MONGO_URI=mongodb://mongo:27017/ecommerce_reviews
    - RABBITMQ_URL=amqp://admin:adminpassword@rabbitmq:5672
    - ORDER_SERVICE_URL=http://order-service:8004
    - JWT_SECRET=supersecretjwtkey_12345
    depends_on:
    - mongo
    - rabbitmq
    - order-service
    networks:
    - ecommerce-network
  promotion-service:
    build:
      context: .
      dockerfile: ./microservices/promotion-service/Dockerfile
    environment:
    - PORT=8012
    - NODE_ENV=development
    - DB_DIALECT=postgres
    - DB_HOST=postgres
    - DB_NAME=promotion_db
    - DB_USER=admin
    - DB_PASS=${POSTGRES_PASSWORD:-adminpassword}
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://admin:adminpassword@rabbitmq:5672
    - JWT_SECRET=${JWT_SECRET}
    depends_on:
    - rabbitmq
    - postgres
    - redis
    networks:
    - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
  notification-service:
    build:
      context: .
      dockerfile: ./microservices/notification-service/Dockerfile
    environment:
    - NODE_ENV=development
    - RABBITMQ_URL=amqp://admin:adminpassword@rabbitmq:5672
    depends_on:
    - rabbitmq
    networks:
    - ecommerce-network
  api-gateway:
    build: ./api-gateway
    ports:
    - 8000:8000
    environment:
    - PORT=8000
    - NODE_ENV=development
    - REDIS_URL=redis://redis:6379
    - JWT_SECRET=${JWT_SECRET}
    - AUTH_SERVICE_URL=http://auth-service:8001
    - PRODUCT_SERVICE_URL=http://product-service:8003
    - ORDER_SERVICE_URL=http://order-service:8004
    - PAYMENT_SERVICE_URL=http://payment-service:8006
    - CART_SERVICE_URL=http://cart-service:8007
    - SEARCH_SERVICE_URL=http://search-service:8008
    - REVIEW_SERVICE_URL=http://review-service:8009
    - AIML_SERVICE_URL=http://ai-ml-service:8010
    - AI_SERVICE_URL=http://ai-service:8005
    - PROMOTION_SERVICE_URL=http://promotion-service:8012
    # CRIT-06: Explicit CORS allowlist — add production domains here
    - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002
    depends_on:
    - redis
    - auth-service
    - product-service
    - order-service
    - payment-service
    - cart-service
    - search-service
    - review-service
    - promotion-service
    - notification-service
    networks:
    - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  storefront:
    build:
      context: ./frontend/apps/storefront
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 1079312831480-8hth9o4voo676a9kolh521jcrq6f48pi.apps.googleusercontent.com
    ports:
    - 3000:3000
    environment:
    - API_URL=http://api-gateway:8000
    - NEXT_PUBLIC_API_URL=${API_URL_EXTERNAL:-http://localhost:8000}
    - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-1079312831480-8hth9o4voo676a9kolh521jcrq6f48pi.apps.googleusercontent.com}
    depends_on:
    - api-gateway
    networks:
    - ecommerce-network
  admin-dashboard:
    build:
      context: ./frontend/apps/admin-dashboard
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
    - 3001:3000
    environment:
    - API_URL=http://api-gateway:8000
    - NEXT_PUBLIC_API_URL=${API_URL_EXTERNAL:-http://localhost:8000}
    depends_on:
    - api-gateway
    networks:
    - ecommerce-network
  seller-hub:
    build:
      context: ./frontend/apps/seller-hub
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
    - 3002:3000
    environment:
    - API_URL=http://api-gateway:8000
    - NEXT_PUBLIC_API_URL=${API_URL_EXTERNAL:-http://localhost:8000}
    depends_on:
    - api-gateway
    networks:
    - ecommerce-network
  ai-ml-service:
    build:
      context: ./microservices/ai-ml-service
      dockerfile: ./Dockerfile
    ports:
    - 8010:8010
    environment:
    - PORT=8010
    networks:
    - ecommerce-network
    restart: always
networks:
  ecommerce-network:
    driver: bridge
volumes:
  mongo_data: null
  redis_data: null
  rabbitmq_data: null
  es_data: null
  minio_data: null
  # CRIT-04: PostgreSQL persistent volume
  postgres_data: null
