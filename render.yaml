services:
- type: web
  name: ecommerce-api-gateway
  env: node
  plan: free
  buildCommand: npm install -g pnpm@9 && pnpm install --filter api-gateway --config.ignore-scripts=true
  startCommand: node api-gateway/src/index.js
  healthCheckPath: /health
  envVars:
  - key: NODE_ENV
    value: production
  - key: NODE_VERSION
    value: 20.10.0
  - key: PNPM_VERSION
    value: 9.4.0
  - key: AUTH_SERVICE_URL
    value: https://ecommerce-auth-service.onrender.com
  - key: PRODUCT_SERVICE_URL
    value: https://ecommerce-product-service.onrender.com
  - key: ORDER_SERVICE_URL
    value: https://ecommerce-order-service.onrender.com
  - key: CART_SERVICE_URL
    value: https://ecommerce-cart-service.onrender.com
  - key: PAYMENT_SERVICE_URL
    value: https://ecommerce-payment-service.onrender.com
  - key: REVIEW_SERVICE_URL
    value: https://ecommerce-review-service.onrender.com
  - key: SEARCH_SERVICE_URL
    value: https://ecommerce-search-service.onrender.com
  - key: AI_SERVICE_URL
    value: https://ecommerce-ai-service.onrender.com
  - key: MONITORING_SERVICE_URL
    value: https://ecommerce-monitoring-service.onrender.com
  - key: AIML_SERVICE_URL
    value: https://ecommerce-aiml-service.onrender.com
  - key: PORT
    value: '8000'
  - key: REDIS_URL
    sync: false
  - key: JWT_SECRET
    sync: false
