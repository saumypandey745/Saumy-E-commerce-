  name: ecommerce-aiml-service
  env: python
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
  rootDir: microservices/ai-ml-service
  healthCheckPath: /health
  envVars:
